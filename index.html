<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosette — a guilloche engraver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d2623;--tx:#cfe3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;font-family:"DM Mono",ui-monospace,monospace;font-size:13px}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;opacity:.75;pointer-events:none;transition:opacity .8s}
.row{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 16px}
label{display:flex;gap:8px;align-items:center}
input[type=text]{width:13ch;background:none;border:0;border-bottom:1.5px solid var(--tx);color:var(--tx);font:inherit;font-size:16px;padding:4px 0;outline:none;border-radius:0}
input[type=range]{width:96px;accent-color:#e86a86}
input:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
#strip{display:flex;gap:8px;min-height:34px}
#strip img{height:34px;border-radius:2px;box-shadow:0 1px 6px #0008;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(24px) scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){#strip img{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="A guilloche rosette. Move the pointer to change the gears and depth, click to engrave."></canvas>
<div class="hint" id="hint">Move to tune the gears. Click to engrave a note.</div>
<div class="row">
  <label>name <input type="text" id="name" value="Dodo" maxlength="14" autocomplete="off" spellcheck="false"></label>
  <label>spread <input type="range" id="spread" min="12" max="100" value="100"></label>
  <div id="strip" aria-label="Engraved notes"></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2,N=84,M=720;
const ct=new Float32Array(M+1),st=new Float32Array(M+1);
for(let j=0;j<=M;j++){const t=j/M*TAU;ct[j]=Math.cos(t);st[j]=Math.sin(t)}
const bx=new Float32Array(M+1),by=new Float32Array(M+1);
let W,H,dpr,card={},paper,name='Dodo',spread=1,pointerAt=-1e9,pend=false,pulse=-1e9;
const s={x:.5,y:.5,tx:.5,ty:.5};let eng=null;
const hint=document.getElementById('hint'),strip=document.getElementById('strip');
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr);
  const availH=H-110*dpr;let w=Math.min(W*.94,availH*1.95,1500*dpr),h=w*.52;
  if(h>availH*.96){h=availH*.96;w=h/.52}
  card={w:Math.round(w),h:Math.round(h),x:Math.round((W-w)/2),y:Math.round(Math.max(36*dpr,(availH-h)/2+24*dpr))};
  paper=document.createElement('canvas');paper.width=card.w;paper.height=card.h;
  const p=paper.getContext('2d'),id=p.createImageData(card.w,card.h),d=id.data;
  for(let i=0;i<d.length;i+=4){const g=(Math.random()-.5)*10;d[i]=227+g;d[i+1]=236+g;d[i+2]=223+g;d[i+3]=255}
  p.putImageData(id,0,0);
}
const sm=f=>f*f*(3-2*f);
function base(nF,d,psi){
  const n1=Math.floor(nF),f=sm(nF-n1),n2=n1+1,k=1/(1+d);
  for(let j=0;j<=M;j++){
    const t=j/M*TAU,a=n1*t+psi,b=n2*t+psi;
    const x1=ct[j]+d*Math.cos(a),y1=st[j]-d*Math.sin(a),x2=ct[j]+d*Math.cos(b),y2=st[j]-d*Math.sin(b);
    bx[j]=(x1+(x2-x1)*f)*k;by[j]=(y1+(y2-y1)*f)*k;
  }
}
function lines(cx,cy,R,from,to,theta,hue0,alpha,lw,lead){
  ctx.lineWidth=lw;ctx.lineJoin='round';
  for(let i=from;i<to;i++){
    const a=i/N*theta,c=Math.cos(a),sn=Math.sin(a),u=i/N;
    ctx.strokeStyle=lead&&i>to-3?'rgba(200,30,70,.95)':`hsla(${hue0+u*150},62%,${30+10*Math.sin(u*TAU*2)}%,${alpha})`;
    ctx.beginPath();
    for(let j=0;j<=M;j++){const x=cx+(bx[j]*c-by[j]*sn)*R,y=cy+(bx[j]*sn+by[j]*c)*R;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();
  }
}
function serial(n,d,th){
  let h=2166136261;for(const v of[Math.round(n),Math.round(d*100),Math.round(th*100)]){h^=v;h=Math.imul(h,16777619)}
  const x=(h>>>0).toString(16).toUpperCase().padStart(8,'0');return 'DDP '+x.slice(0,4)+' '+x.slice(4);
}
function frame(ms){
  const t=ms/1000,idle=ms-pointerAt>4000;
  if(idle&&!reduce){s.tx=.5+.38*Math.sin(t*.21);s.ty=.5+.34*Math.sin(t*.29+1.3)}
  s.x+=(s.tx-s.x)*.07;s.y+=(s.ty-s.y)*.07;
  let nF=3+s.x*10,d=.16+(1-s.y)*.62,th=spread*TAU;
  if(eng){nF=eng.nF;d=eng.d;th=eng.th}
  const psi=reduce?0:t*.12;
  ctx.fillStyle='#0d2623';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=40*dpr;ctx.shadowOffsetY=14*dpr;ctx.fillStyle='#e3ecdf';ctx.fillRect(card.x,card.y,card.w,card.h);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(card.x,card.y,card.w,card.h);ctx.clip();
  ctx.drawImage(paper,card.x,card.y);
  const cx=card.x+card.w/2,cy=card.y+card.h/2,R=card.h*.43,m=card.h*.045;
  // border strips: two interlaced waves, frequency follows the gear count
  ctx.lineWidth=.8*dpr;
  for(const side of[0,1]){
    const yc=side?card.y+card.h-m*1.9:card.y+m*1.9,amp=m*.55;
    for(let k=0;k<5;k++){
      ctx.strokeStyle=`hsla(${170+k*30},55%,32%,.55)`;ctx.beginPath();
      for(let x=0;x<=card.w;x+=3*dpr){const u=x/card.w;const y=yc+amp*Math.sin(u*TAU*(nF*1.5)+k*.9+psi*3)*Math.sin(u*Math.PI);x?ctx.lineTo(card.x+x,y):ctx.moveTo(card.x+x,y)}
      ctx.stroke();
    }
  }
  ctx.strokeStyle='rgba(15,92,87,.7)';ctx.lineWidth=1.2*dpr;ctx.strokeRect(card.x+m*.6,card.y+m*.6,card.w-m*1.2,card.h-m*1.2);
  // rosette
  base(nF,d,psi);
  ctx.globalCompositeOperation='multiply';
  const lw=.65*dpr;
  if(eng){
    const p=Math.min(1,(ms-eng.t0)/1500),e=1-Math.pow(1-p,3),cnt=Math.max(1,Math.ceil(e*N));
    lines(cx,cy,R,0,N,th,168,.1,lw,false);
    lines(cx,cy,R,0,cnt,th,168,.62,lw,p<1);
    if(p>=1){eng=null;pend=true;pulse=ms}
  }else lines(cx,cy,R,0,N,th,168,.6,lw,false);
  ctx.globalCompositeOperation='source-over';
  // name plate
  const pr=R*.27;ctx.fillStyle='#e3ecdf';ctx.beginPath();ctx.arc(cx,cy,pr,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(15,92,87,.8)';ctx.lineWidth=1.2*dpr;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,pr*.9,0,TAU);ctx.lineWidth=.6*dpr;ctx.stroke();
  let fs=pr*.62;const txt=(name||' ');ctx.font=`italic 600 ${fs}px "Bodoni Moda",Georgia,serif`;
  const tw=ctx.measureText(txt).width;if(tw>pr*1.55){fs*=pr*1.55/tw;ctx.font=`italic 600 ${fs}px "Bodoni Moda",Georgia,serif`}
  ctx.fillStyle='#0f5c57';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,cx,cy+fs*.04);
  // specs and serial
  const fz=Math.max(10,12*dpr);ctx.font=`${fz}px "DM Mono",monospace`;ctx.fillStyle='rgba(15,92,87,.85)';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const lx=card.x+m*2.2,by0=card.y+card.h-m*3.4;
  ctx.fillText('gears '+Math.round(nF),lx,by0-fz*2.6);ctx.fillText('depth '+d.toFixed(2),lx,by0-fz*1.3);ctx.fillText('spread '+Math.round(th/TAU*100)+'%',lx,by0);
  const sr=serial(Math.round(nF),d,th/TAU);ctx.textAlign='right';ctx.fillStyle=(ms-pulse<1400)?'rgba(190,30,70,.95)':'rgba(15,92,87,.85)';
  ctx.fillText(sr,card.x+card.w-m*2.2,by0);
  if(ms-pulse<1400){const q=(ms-pulse)/1400;ctx.strokeStyle=`rgba(190,30,70,${1-q})`;ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(cx,cy,R*(1+q*.25),0,TAU);ctx.stroke()}
  ctx.restore();
  if(pend){
    pend=false;const tc=document.createElement('canvas');tc.width=300;tc.height=Math.round(300*card.h/card.w);
    tc.getContext('2d').drawImage(cv,card.x,card.y,card.w,card.h,0,0,tc.width,tc.height);
    const im=new Image();im.src=tc.toDataURL();im.alt='Engraved note '+sr;im.title=sr;strip.appendChild(im);
    while(strip.children.length>6)strip.removeChild(strip.firstChild);
  }
  requestAnimationFrame(frame);
}
function pt(e){return[e.clientX/innerWidth,e.clientY/innerHeight]}
cv.addEventListener('pointermove',e=>{if(eng)return;[s.tx,s.ty]=pt(e);pointerAt=performance.now();hint.style.opacity=0});
cv.addEventListener('pointerdown',e=>{
  if(eng)return;[s.tx,s.ty]=pt(e);pointerAt=performance.now();hint.style.opacity=0;
  eng={t0:performance.now(),nF:3+s.tx*10,d:.16+(1-s.ty)*.62,th:spread*TAU};
});
document.getElementById('name').addEventListener('input',e=>{name=e.target.value.trim()});
document.getElementById('spread').addEventListener('input',e=>{spread=e.target.value/100});
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
